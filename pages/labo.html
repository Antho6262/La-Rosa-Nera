<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Labo — La Rosa Nera</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="shell"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/app.js"></script>
<script>
let SESSION;

function renderContent() {
  document.getElementById("content").innerHTML = `
    <h1>Labo</h1>
    <div class="sigil-rule"></div>

    <div class="panel mt16">
      <div class="panel-head"><h2>Page en construction</h2></div>
      <p class="muted">Le système de recettes sera configuré prochainement.</p>
    </div>
  `;
}

(async function () {
  await authReady;
  SESSION = await initShell("labo", "Labo");
  if (!SESSION) return;
  renderContent();
})();
</script>
</body>
</html>
